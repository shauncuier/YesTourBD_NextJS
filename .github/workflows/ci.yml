name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the run still in flight; only the tip matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Next 16 needs >= 20.9. 22 is the active LTS, 24 is what the project is developed on.
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    # The build prerenders `/` from the service catalogue, so CI needs a real database
    # rather than a mock. Throwaway, one per job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yestourbd_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yestourbd_ci?schema=public
      # Throwaway, for a build that never serves a request. The real one is a deployment
      # secret and is not in this repo.
      AUTH_SECRET: ci-only-not-a-real-secret-000000000000000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # postinstall runs `prisma generate`, so the client exists from here on.
      - run: npm ci

      # Apply the committed migrations, then seed: the build reads the catalogue back out,
      # which makes this a real check that migration + seed + query agree.
      - run: npm run db:deploy
      - run: npm run db:seed

      - run: npm run lint

      # `typecheck` runs `next typegen` first: PageProps/LayoutProps/RouteContext are
      # generated into .next/types, which a fresh clone does not have.
      - run: npm run typecheck

      - run: npm test

      # Build last: it is the slowest step and the one the others usually predict.
      - run: npm run build
